catalog: supply_chain
landing_path: /Volumes/supply_chain/landing/raw_files
source_file: DataCoSupplyChainDataset.csv
encoding: latin-1
batch_size: 20000

inventory:
  lead_time_weeks: 1       # an order arrives 1 week after it's placed
  safety_weeks: 0.5        # extra buffer = half a week of average demand
  initial_cover_weeks: 2   # starting stock = 2 weeks of demand
  avg_window_weeks: 4      # "average demand" = last 4 weeks

risk_tiers:
  high: 0.75     # late risk >= 75% → High
  medium: 0.50   # 50–75% → Medium, below → Low

cost_assumptions:              # ILLUSTRATIVE assumptions, not from the data
  late_order_cost: 15          # $ lost per late order (credits, support, churn risk)
  expedite_cost: 8             # $ to speed up one order
  expedite_effectiveness: 0.6  # share of late orders that speeding up actually saves

forecast:
  data_start: "2015-01-05"   # first full week (Monday)
  data_end: "2017-09-24"     # last full week before the Oct-2017 volume drop
  test_start: "2017-01-01"   # backtest: forecast 2017 weeks using only past data
  min_train_weeks: 52        # need at least 1 year of history
  horizon_weeks: 13          # future forecast ~3 months